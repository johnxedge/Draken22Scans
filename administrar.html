<!-- PÁGINA DE ADMINISTRACIÓN/INFORMACIÓN: contiene instrucciones y accesos relacionados con la gestión del sitio. Los estilos compartidos están en styles.css. -->
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#070b0f">
    <title>Sobre las traducciones — Draken22 Scans</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="info-page">
    <!-- CONTENIDO PRINCIPAL de esta página informativa. -->
    <main class="info-panel panel">
        <div class="info-image" id="avatar-preview" role="img" aria-label="Avatar de Draken22 Scans"></div>
        <div class="avatar-picker">
            <label for="avatar-choice"></label>
            <select id="avatar-choice" aria-label="Avatar">
                <option value="portadas/Avatar.png">Draken22</option>
            </select>
        </div>
        <h1 class="info-title"></h1>
        <p class="info-copy">Traducimos fanmangas de Dragon Ball al español para que todos puedan disfrutarlos.</p>
        <a class="btn-yellow info-home" href="index.html">← Ir a la página principal</a>
    </main>
<script>
(() => {
  const select = document.getElementById('avatar-choice');
  const preview = document.getElementById('avatar-preview');
  select.value = 'portadas/Avatar.png';
  const update = () => {
    preview.style.backgroundImage = `url("${select.value}")`;
  };
  select.addEventListener('change', update);
  update();
})();
</script>
</body>

</html>
